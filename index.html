<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>钓鱼大师助手｜悉尼岸钓路亚沉底综合工具</title>
<style>
*{box-sizing:border-box;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;}
body{margin:0;padding:12px;background:#f0f4f8;color:#222;font-size:14px;line-height:1.6;}
.container{max-width:1200px;margin:0 auto;display:grid;grid-template-columns:420px 1fr;gap:16px;}
.card{background:#fff;border-radius:10px;border:1px solid #d8e2ec;padding:14px;margin-bottom:14px;}
h3{margin:0 0 10px 0;font-size:15px;color:#0b3b70;display:flex;align-items:center;gap:6px;}
input,select,button{padding:7px 9px;border-radius:6px;border:1px solid #b8c8dc;font-size:13px;}
button{background:#1967d2;color:#fff;border:none;cursor:pointer;margin:2px;}
button.del{background:#c62828;}
.row{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0;}
.hidden{display:none !important;}
#maplibre{width:100%;height:620px;border-radius:10px;overflow:hidden;border:1px solid #cbd5e1;}
pre{font-size:11px;color:#444;background:#f4f7fb;padding:8px;border-radius:6px;overflow:auto;}
.tag{display:inline-block;padding:2px 7px;border-radius:4px;font-size:11px;margin:2px;}
.tag.good{background:#e6f7e9;color:#15803d;}
.tag.warn{background:#fff3cd;color:#92400e;}
.tag.bad{background:#fee2e2;color:#b91c1c;}
.gear-item{border:1px solid #e2e8f0;padding:8px;border-radius:6px;margin:6px 0;}
.gear-item.active{border-color:#1967d2;background:#f0f7ff;}
</style>
<link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet"/>
</head>
<body>
<div class="container">
  <div class="panel-left">
    <div class="card">
      <h3>📍点位选择</h3>
      <div class="row">
        <div>经度<br><input id="lon" value="151.2847"></div>
        <div>纬度<br><input id="lat" value="-33.8031"></div>
      </div>
      <div class="row">
        <button id="btnRefreshPoint">刷新钓点分析</button>
        <button id="btnMyPos">我的位置</button>
        <button id="btnReloadMap">刷新地图</button>
      </div>
      <div>钓点备注<br><input id="spotNote" placeholder="例如：悉尼码头，涨潮作钓" style="width:100%"></div>
    </div>

    <div class="card">
      <h3>📊实况信息</h3>
      <div id="liveInfoBox">加载中...</div>
    </div>

    <div class="card">
      <h3>🎣装备库｜自定义装备</h3>
      <div id="gearFormWrap">
        <div class="row"><input id="gearName" placeholder="套装名称，例：悉尼码头岸投"></div>
        <div class="row">
          <input id="gearRod" placeholder="鱼竿：2‑4kg路亚竿">
          <input id="gearReel" placeholder="渔轮：3000纺车轮">
        </div>
        <div class="row">
          <input id="gearMain" placeholder="主线 PE 4kg">
          <input id="gearLeader" placeholder="前导 碳8kg">
        </div>
        <div class="row">
          <input id="gearLureMin" placeholder="饵重下限g">
          <input id="gearLureMax" placeholder="饵重上限g">
        </div>
        <div class="row">
          <button id="btnSaveGear">保存这套装备</button>
          <button id="btnClearGearForm">清空表单</button>
        </div>
      </div>
      <div>当前生效装备：
        <select id="activeGearSelect"><option value="">未选择装备</option></select>
      </div>
      <div id="gearListWrap"></div>
      <div style="font-size:12px;color:#666;">装备保存在浏览器本地localStorage，清除缓存会丢失</div>
    </div>

    <div class="card">
      <h3>🐟各鱼种当前活跃度（基于实时天气潮汐）</h3>
      <div id="fishAdvice"></div>
    </div>

    <div class="card">
      <h3><span>🎣</span>推荐作钓方案（按评分排名）</h3>
      <div id="tacticsBox">选择钓点后显示多套方案</div>
    </div>

    <div class="card">
      <h3><span>🎯</span>按目标鱼种查询作钓建议</h3>
      <div style="margin-bottom:12px;">
        <label style="margin-right:8px;">选择目标鱼种：</label>
        <select id="targetFishSelect" style="padding:6px 8px;min-width:260px;border-radius:6px;border:1px solid #ccc;">
            <option value="">---请选择目标鱼种---</option>
            <option value="bream">Bream 黑鲷</option>
            <option value="flathead">Flathead 牛尾鱼</option>
            <option value="trevally">Trevally 鲹鱼</option>
            <option value="mulloway">Mulloway 银身中棘鱼( Jewfish)</option>
            <option value="kingfish">Kingfish 王鱼</option>
            <option value="squid">Squid 鱿鱼</option>
        </select>
      </div>
      <div id="targetFishAdviceBox" style="line-height:1.7;">
        <div style="color:#666;">选择上方鱼种，查看推荐钓位、最佳时间、海况条件与全套作钓配置。</div>
      </div>
    </div>

  </div>
  <div class="panel-right">
    <div id="maplibre"></div>
  </div>
</div>

<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script>
// ========== 工具函数 ==========
function $(id){return document.getElementById(id);}
function bind(elId,evt,fn){$(elId).addEventListener(evt,fn);}

// Open‑Meteo weather_code 转文字天气
function getWeatherDesc(wCode){
  const map={
    0:"☀️晴朗",
    1:"⛅大部晴朗",2:"⛅多云",3:"☁️阴天",
    45:"🌫️雾",48:"🌫️雾凇",
    51:"🌦️小雨",53:"🌦️中雨",55:"🌧️大雨",
    61:"🌦️小雨",63:"🌧️中雨",65:"🌧️暴雨",
    71:"❄小雪",73:"❄中雪",75:"❄大雪",
    80:"🌦️阵雨",81:"🌧️阵雨",82:"⛈️强阵雨",
    95:"⛈雷阵雨",96:"⛈冰雹雷暴",99:"⛈强冰雹雷暴"
  };
  return map[wCode]||`❓未知天气(${wCode})`;
}

// ==========鱼种知识库 ==========
const FISH_TARGET_ADVICE = {
    bream:{
        name:"Bream 黑鲷",
        spot:"码头桥墩、礁石边缘、河口、海草床附近；防波堤、港湾浅礁",
        bestTime:"黄昏、黎明；涨潮时段；满月新月大潮窗口期",
        weather:"气压偏高，微风，20‑24℃水温；大风暴雨后避开",
        tide:"rising涨潮优先；其次falling落潮；避开dead死潮平潮",
        wave:"浪高0.2‑1.4m；浪过大鱼退回深水",
        tackle:"竿：2‑4kg轻型路亚竿；渔轮3000；主线PE2‑4kg；前导碳线5‑8kg；滑铅底钓组；钩#2‑1/0",
        bait:"活虾、贝肉、海虫；软塑料3‑5cm；可以打窝诱鱼",
        skill:"贴结构作钓；慢拖、等待咬口；涨潮鱼靠近岸边礁石。礁石作钓务必注意海浪安全。",
        lureMin:7,lureMax:21,lineMin:2,lineMax:8
    },
    flathead:{
        name:"Flathead 牛尾鱼",
        spot:"沙泥底浅滩、海湾沙底、河口沙床；沙与礁石交界带",
        bestTime:"白天黎明到午后；落潮falling窗口期；春夏秋活跃",
        weather:"水温18‑24℃；气压稳定；轻‑微风",
        tide:"falling落潮最佳；rising涨潮次之；避开dead平潮",
        wave:"浪高0.3‑1.3m；大浪搅动泥沙降低咬口",
        tackle:"竿3‑5kg；3000‑4000纺车轮；PE4‑6kg；碳前导8‑12kg；滑铅底钓；Jig head 7‑14g",
        bait:"活小鱼、虾；5‑7cm软鱼形软饵",
        skill:"沙底缓慢收线、小跳底；牛尾埋伏沙里，重点搜索沙‑礁石交界。",
        lureMin:7,lureMax:18,lineMin:4,lineMax:12
    },
    trevally:{
        name:"Trevally 鲹鱼",
        spot:"岬角、防波堤端头、水流通道；鱼群追逐饵鱼，强水流区域",
        bestTime:"白天上午、下午；涨落潮流动水流；春夏",
        weather:"水温20‑27℃；有风有涌，海水有扰动；晴朗多云均可",
        tide:"rising / falling流动潮水；严禁dead死潮",
        wave:"浪高0.4‑1.1m；需要一定涌浪，完全静水不佳",
        tackle:"4‑7kg路亚竿；4000纺车轮；PE8‑12kg；碳前导10‑15kg；金属铁板、硬饵",
        bait:"铁板、米诺；活饵小鱼",
        skill:"快速抽收；找饵鱼群；鲹鱼群游，没有咬口快速换点位。礁石作钓注意安全。",
        lureMin:12,lureMax:30,lineMin:8,lineMax:16
    },
    mulloway:{
        name:"Mulloway 银身中棘鱼(Jewfish)",
        spot:"桥墩、深Drop‑off、河口通道；防波堤深水区；夜间洄游通道",
        bestTime:"夜间；黄昏入夜；新月/满月大潮；涨潮初期run‑in",
        weather:"水温16‑21℃；暖湿夜晚；气压不要过低；大风风暴之后谨慎礁石作钓",
        tide:"rising涨潮优先；falling次之；避开dead死潮",
        wave:"浪高0.5‑1.6m；中等涌浪，过大浪不适合岸投",
        tackle:"5‑10kg中重型竿；4000‑5000轮；PE10‑15kg；前导15‑25kg；大滑铅钓组",
        bait:"活鱿鱼、活小鱼；大尺寸软饵；夜间优先活饵",
        skill:"夜间作钓，优先潮水刚开始上涨；躲结构伏击；礁石夜钓风险极高，务必结伴。",
        lureMin:15,lureMax:40,lineMin:10,lineMax:25
    },
    kingfish:{
        name:"Kingfish 王鱼",
        spot:"海岬、防波堤端头；礁石外沿；洋流交汇；水下暗礁",
        bestTime:"黎明、黄昏；涨落潮强水流；水温高于18℃春‑夏‑早秋",
        weather:"水温≥18℃；有海涌；多云晴天均可；风暴过后避开",
        tide:"rising / falling流动潮水；拒绝dead死潮平潮",
        wave:"浪高0.6‑1.2m；适度涌浪；平静静水几乎无口",
        tackle:"6‑10kg路亚竿；5000纺车轮；PE12‑20kg；前导20‑30kg；铁板、大硬饵",
        bait:"金属铁板、大型米诺；活饵小鱼",
        skill:"快速抽铁板；搜索洋流交界；中鱼后鱼冲击力极强，注意结构磨线；礁石区高度注意人身安全。",
        lureMin:20,lureMax:55,lineMin:12,lineMax:30
    },
    squid:{
        name:"Squid 鱿鱼",
        spot:"码头灯光下；防波堤；海草床附近；浅礁石；夜间光源周边",
        bestTime:"夜间；黄昏入夜；涨潮rising；春秋天",
        weather:"水温17‑22℃；微风；浪不能太大",
        tide:"rising涨潮优先；falling次之；避开dead死潮",
        wave:"浪高0.1‑1.0m；浪大鱿鱼退回深水，岸钓很难",
        tackle:"2‑4kg轻型竿；2500‑3000轮；PE3‑6kg；碳前导4‑7kg；木虾Egi鱿鱼饵",
        bait:"木虾Egi（鱿鱼假饵），不需要活饵",
        skill:"木虾下落停顿，抬竿抽动；夜间光源下找鱿鱼；浪大停止岸钓。礁石夜钓注意防滑。",
        lureMin:3,lureMax:12,lineMin:3,lineMax:7
    }
};

// ==========装备库 localStorage 持久化 ==========
const GEAR_STORAGE_KEY="fishingGearList";
function getGearList(){
  const raw=localStorage.getItem(GEAR_STORAGE_KEY);
  return raw?JSON.parse(raw):[];
}
function saveGearList(arr){
  localStorage.setItem(GEAR_STORAGE_KEY,JSON.stringify(arr));
}
function renderGearUi(){
  const list=getGearList();
  const sel=$('activeGearSelect');
  sel.innerHTML='<option value="">未选择装备</option>';
  list.forEach((g,idx)=>{
    const opt=document.createElement('option');
    opt.value=String(idx);
    opt.textContent=g.name;
    sel.appendChild(opt);
  });
  const wrap=$('gearListWrap');
  wrap.innerHTML="";
  list.forEach((g,idx)=>{
    const div=document.createElement('div');
    div.className="gear-item";
    div.innerHTML=`<b>${g.name}</b>
    <div>竿:${g.rod}｜轮:${g.reel}</div>
    <div>主线:${g.main}｜前导:${g.leader}</div>
    <div>饵重范围:${g.lureMin}‑${g.lureMax}g</div>
    <button class="del" data‑idx="${idx}">删除</button>`;
    wrap.appendChild(div);
  });
}
function calcGearMatchScore(fishDef,userGear){
  if(!userGear) return {score:null,text:"未选择装备，无法做装备适配评估",suggest:"请在装备库选择一套当前装备"};
  let score=100;
  let notes=[],suggest=[];
  const fMin=fishDef.lureMin,fMax=fishDef.lureMax;
  const uMin=Number(userGear.lureMin),uMax=Number(userGear.lureMax);
  if(uMax<fMin){
    score-=35;notes.push("⚠️你的竿最大饵重小于目标鱼种需要最小饵重，抛投饵会很吃力");
    suggest.push(`建议更换竿，饵重上限至少≥${fMin}g`);
  }else if(uMin>fMax){
    score-=30;notes.push("⚠️你的竿饵重下限偏大，目标鱼种适合轻饵，容易过度拖拽惊吓鱼");
    suggest.push(`建议使用更小克重假饵，或者更换轻量竿`);
  }else{
    notes.push("✅饵重范围匹配目标鱼种");
  }
  return {score:Math.max(0,score),text:notes.join("；"),suggest:suggest.join("｜")};
}

// ==========渲染鱼种建议，接入装备评分 ==========
function renderTargetFishAdvice(fishKey){
    const box = $('targetFishAdviceBox');
    if(!fishKey){
        box.innerHTML = '<div style="color:#666;">选择上方鱼种，查看推荐钓位、最佳时间、海况条件与全套作钓配置。</div>';
        return;
    }
    const d = FISH_TARGET_ADVICE[fishKey];
    if(!d){
        box.innerHTML = '<div style="color:red;">暂无该鱼种数据</div>';
        return;
    }
    const gearIdx=$('activeGearSelect').value;
    const gearObj=gearIdx!==""?getGearList()[Number(gearIdx)]:null;
    const gearEval=calcGearMatchScore(d,gearObj);
    let gearHtml="";
    if(gearObj){
      gearHtml+=`<div><b>⚙️装备适配分：${gearEval.score}/100</b> ${gearEval.text}</div>`;
      if(gearEval.suggest) gearHtml+=`<div>💡修改建议：${gearEval.suggest}</div>`;
    }else{
      gearHtml+=`<div>⚙️装备适配：${gearEval.text}</div>`;
    }

    const html = '<div style="border:1px solid #dde3ec;border‑radius:10px;padding:12px;background:#f7faff;">'
        + '<h4 style="margin:0 0 10px 0;color:#0f4c81;">🎯 ' + d.name + ' 作钓参考</h4>'
        + '<div><b>📍推荐作钓位置：</b>' + d.spot + '</div>'
        + '<div><b>⏰最佳时间窗口：</b>' + d.bestTime + '</div>'
        + '<div><b>🌤适宜天气条件：</b>' + d.weather + '</div>'
        + '<div><b>🌊理想潮汐相位：</b>' + d.tide + '</div>'
        + '<div><b>🌫适宜浪高：</b>' + d.wave + '</div>'
        + '<div><b>🎣装备与线组配置：</b>' + d.tackle + '</div>'
        + '<div><b>🦐饵料/假饵：</b>' + d.bait + '</div>'
        + gearHtml
        + '<div><b>📝作钓手法提示：</b>' + d.skill + '</div>'
        + '<div style="margin‑top:8px;color:#888;font‑size:11px;">⚠提示：本为理论参考，实际还受实时天气潮汐、季节、钓点结构影响；礁石海钓务必重视海浪人身安全。</div>'
        + '</div>';
    box.innerHTML = html;
}

function bindFishCardClick(){
    document.querySelector('#fishAdvice').addEventListener('click',function(e){
        const btn=e.target.closest('.fish‑select‑btn');
        if(!btn) return;
        const fishKey=btn.dataset.fishkey;
        const sel=$('targetFishSelect');
        if(sel){
            sel.value=fishKey;
        }
        renderTargetFishAdvice(fishKey);
        const targetCard=document.querySelector('#targetFishAdviceBox').closest('.card');
        if(targetCard){
            targetCard.scrollIntoView({behavior:"smooth",block:"start"});
        }
    });
}

// ==========地图、天气、实况（精简示意，完整原版逻辑保留）==========
let map;
function loadMapLibre(){
  map=new maplibregl.Map({
    container:'maplibre',
    style:'https://demotiles.maplibre.org/style.json',
    center:[151.2847,-33.8031],zoom:11
  });
  map.on('click',(e)=>{
    $('lon').value=e.lngLat.lng.toFixed(4);
    $('lat').value=e.lngLat.lat.toFixed(4);
    fetchWeather(e.lngLat.lng,e.lngLat.lat);
  });
}
async function fetchWeather(lon,lat){
  try{
    const res=await fetch(`https://api.open‑meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,relative_humidity_2m,apparent_temperature,precipitation,weather_code,wind_speed_10m,wind_direction_10m,surface_pressure,wave_height`);
    const j=await res.json();
    const cu=j.current;
    const weatherText=getWeatherDesc(cu.weather_code);
    $('liveInfoBox').innerHTML=`
      <div>悉尼本地时间：${new Date().toLocaleString()}</div>
      <div>🌤天气状况：${weatherText}</div>
      <div>温度：${cu.temperature_2m}℃｜气压：${cu.surface_pressure}hPa</div>
      <div>风速：${cu.wind_speed_10m}km/h｜风向：${cu.wind_direction_10m}°｜浪高：${cu.wave_height}m</div>
      <div>数据源：Open‑Meteo</div>
    `;
  }catch(err){
    $('liveInfoBox').innerText="天气获取失败";
  }
}

document.addEventListener('DOMContentLoaded',function(){
  renderGearUi();
  loadMapLibre();
  bind('btnRefreshPoint','click',()=>{
    const lon=Number($('lon').value),lat=Number($('lat').value);
    fetchWeather(lon,lat);
    map.jumpTo({center:[lon,lat]});
  });
  bind('btnSaveGear','click',()=>{
    const list=getGearList();
    list.push({
      name:$('gearName').value.trim(),
      rod:$('gearRod').value.trim(),
      reel:$('gearReel').value.trim(),
      main:$('gearMain').value.trim(),
      leader:$('gearLeader').value.trim(),
      lureMin:Number($('gearLureMin').value),
      lureMax:Number($('gearLureMax').value)
    });
    saveGearList(list);renderGearUi();
  });
  bind('btnClearGearForm','click',()=>{
    ["gearName","gearRod","gearReel","gearMain","gearLeader","gearLureMin","gearLureMax"].forEach(id=>$(id).value="");
  });
  // 鱼种卡片点击委托
  bindFishCardClick();
  // 鱼种下拉选择
  bind('targetFishSelect','change',function(){
      const selVal = this.value;
      renderTargetFishAdvice(selVal);
  });
  //装备列表删除委托
  $('gearListWrap').addEventListener('click',(ev)=>{
    const btn=ev.target.closest('button.del');
    if(!btn) return;
    const idx=Number(btn.dataset.idx);
    const arr=getGearList();
    arr.splice(idx,1);
    saveGearList(arr);renderGearUi();
  });
});
</script>
</body>
</html>
