<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>钓鱼大师助手</title>
    <style>
*{box-sizing:border-box;margin:0;padding:0;font-family:system-ui}
header{background:#194b8c;color:#fff;padding:12px;display:flex;gap:8px;align-items:center}
header button{background:#2b68bc;color:white;border:none;padding:7px 12px;border-radius:4px;font-size:14px;cursor:pointer}
.container{padding:12px}
.card{background:#f7f9fc;padding:10px;border-radius:6px;margin-bottom:10px;border:1px solid #e2e8f0}
.bottom-bar{position:fixed;bottom:0;left:0;right:0;background:#194b8c;color:#fff;display:flex}
.bottom-bar>div{flex:1;text-align:center;padding:10px;font-size:14px}
input{padding:6px;width:100%;margin:4px 0;border:1px solid #ccc;border-radius:3px}
button{padding:7px 11px;cursor:pointer}
.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.4);z-index:9999}
.modal-content{background:white;margin:15vh auto;width:90%;max-width:520px;padding:18px;border-radius:8px}
</style>
</head>
<body>
<header>
    <span>🎣钓鱼大师助手</span>
    <button id="btn-teach">教学栏</button>
    <button id="btn-manual">大师速查手册</button>
    <button id="btn-setting">⚙设置</button>
</header>

<div class="container">
    <div class="card">
        <div>🎣选饵七步法</div>
        <div>1 确认钓点类型：码头/礁石/沙滩/河口</div>
        <div>2 读取当前潮汐阶段：涨潮‑满潮‑落潮‑平潮</div>
        <div>3 参考月相：满月/新月/弦月，评估鱼活性</div>
        <div>4 读取天气：气压、风力、水温、浪况</div>
        <div>5 确定目标鱼种，选择饵类型：活饵虾仁/软饵/亮片</div>
        <div>6 水流强度匹配配重：铅坠、咬铅重量</div>
        <div>7 匹配作钓手法，确认最佳出钓窗口</div>
    </div>

    <div class="card">
        <div>📍钓点状态</div>
        <div>--</div>
        <div>经度:<input id="lng" placeholder="经度"></div>
        <div>纬度:<input id="lat" placeholder="纬度"></div>
        <div><button id="refresh‑point">刷新钓点分析</button></div>
    </div>
</div>

<!-- 设置弹窗 -->
<div class="modal" id="modal‑setting">
    <div class="modal-content">
        <h3>设置</h3>
        <div>WillyWeather代理地址</div>
        <input id="proxy‑url" placeholder="https://xxx.vercel.app/api/ww‑proxy">
        <div style="margin:8px 0">
            <button id="save‑proxy">保存设置</button>
            <button id="close‑setting">关闭</button>
        </div>
    </div>
</div>

<div class="bottom-bar">
    <div>实时鱼情</div>
    <div>7天预报</div>
    <div>钓点管理</div>
    <div>装备库</div>
</div>

<script>
// 等待页面全部DOM加载完成，再绑定所有按钮事件
document.addEventListener('DOMContentLoaded',function(){
    const modalSetting = document.getElementById('modal‑setting');
    const btnSetting = document.getElementById('btn‑setting');
    const btnCloseSetting = document.getElementById('close‑setting');
    const btnSaveProxy = document.getElementById('save‑proxy');
    const inputProxyUrl = document.getElementById('proxy‑url');

    //读取本地存储旧代理
    const savedProxy = localStorage.getItem('ww‑proxy');
    if(savedProxy){
        inputProxyUrl.value = savedProxy;
    }

    btnSetting.addEventListener('click',function(){
        modalSetting.style.display = 'block';
    });
    btnCloseSetting.addEventListener('click',function(){
        modalSetting.style.display = 'none';
    });
    btnSaveProxy.addEventListener('click',function(){
        localStorage.setItem('ww‑proxy', inputProxyUrl.value.trim());
        alert("代理地址已保存");
        modalSetting.style.display = 'none';
    });
});
</script>
</body>
</html>
