<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>钓鱼大师助手</title>
<style>
*{box-sizing:border-box;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;}
body{background:#f3f4f6;padding:16px;margin:0;}
.card{padding:16px;border-radius:12px;background:#ffffff;margin-bottom:12px;box-shadow:0 1px 4px rgba(0,0,0,0.1);}
.tide-rate-alert{display:none;padding:6px 8px;border-radius:6px;margin-bottom:8px;}
#tide-svg-wrap{width:100%;height:220px;overflow:hidden;}
.row{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0;}
input,textarea,select{padding:8px;border:1px solid #ccc;border-radius:6px;font-size:14px;}
.btn{padding:8px 14px;background:#2176d2;color:white;border:none;border-radius:6px;cursor:pointer;}
.btn:hover{background:#195cad;}
</style>
</head>
<body>

<div class="card">
<h3>📌钓点综合设置</h3>
<div class="row">
<label>纬度：<input id="inp-lat" type="number" step="0.0001" placeholder="-33.87"></label>
<label>经度：<input id="inp-lon" type="number" step="0.0001" placeholder="151.21"></label>
</div>
<div style="margin:8px 0;">
<label>钓点场景描述：</label>
<textarea id="inp-scene" style="width:100%;min-height:60px;" placeholder="示例：悉尼码头，礁石岸，防波堤，淤泥底"></textarea>
</div>
<div class="row">
<label><input type="checkbox" id="chk-manual"> 启用手动参数（关闭自动天气潮汐）</label>
</div>
<div id="manual-group" style="display:none;border:1px solid #eee;padding:10px;border-radius:8px;margin:8px 0;">
<div class="row">
<label>浪高(m):<input id="inp-wave" type="number" step="0.1"></label>
<label>潮汐阶段：
<select id="sel-tidephase">
<option value="rising">涨潮</option>
<option value="highslack">高平潮</option>
<option value="falling">落潮</option>
<option value="lowslack">低平潮</option>
</select>
</label>
</div>
</div>
<div class="row">
<button class="btn" id="btn-refresh">刷新钓点分析</button>
<button class="btn" id="btn-save">保存钓点</button>
</div>
</div>

<div class="card tide-card">
  <div class="tide-header">
    <h3>🌊今日潮汐（TidesAtlas）
      <span id="tide-rate-text" style="font-size:13px;color:#555;"></span>
    </h3>
    <div id="tide-rate-alert" class="tide-rate-alert"></div>
    <div id="tide-source-info" style="font-size:13px;color:#666;margin-bottom:10px;"></div>
  </div>
  <div id="tide-svg-wrap">
    <svg id="tide-svg" width="100%" height="220" viewBox="0 0 600 220"></svg>
  </div>
  <div id="tide-current-status" style="margin:10px 0;font-size:14px;"></div>
  <div id="tide-next-countdown" style="margin:6px 0;font-size:14px;"></div>
  <div id="tide-extremes-list" style="margin-top:10px;font-size:14px;line-height:1.7;"></div>
  <div id="tide-error-tip" style="color:#d32f2f;display:none;margin-top:8px;"></div>
</div>

<div class="card">
<h3>📊鱼情综合分析</h3>
<div id="fish-score" style="font-size:18px;font-weight:bold;margin:8px 0;"></div>
<div id="fish-pros" style="margin:6px 0;"></div>
<div id="fish-cons" style="margin:6px 0;"></div>
<div id="fish-suggest" style="margin-top:10px;"></div>
</div>

<script>
const TIDES_API_PREFIX = "/tidesatlas";

// ========== 额度存储 ==========
function saveTidesRateLimit(remaining, limit, resetTs){
  localStorage.setItem('tides_remaining', remaining);
  localStorage.setItem('tides_limit', limit);
  localStorage.setItem('tides_reset_ts', resetTs);
  renderRateLimitUi();
}
function renderRateLimitUi(){
  const rem = Number(localStorage.getItem('tides_remaining')??0);
  const lim = Number(localStorage.getItem('tides_limit')??50);
  const resetTs = Number(localStorage.getItem('tides_reset_ts')??0);
  const rateTextEl = document.getElementById('tide-rate-text');
  const alertEl = document.getElementById('tide-rate-alert');
  if(!rateTextEl) return;
  rateTextEl.textContent = `｜剩余请求：${rem}/${lim}`;
  alertEl.style.display = 'none';
  if(rem <= 0){
    alertEl.style.display = 'block';
    alertEl.style.background='#ffebee';
    alertEl.style.color='#c62828';
    alertEl.textContent = `⚠️ TidesAtlas今日额度已耗尽，重置：${new Date(resetTs*1000).toLocaleString()}`;
  }else if(rem <=3){
    alertEl.style.display = 'block';
    alertEl.style.background='#ffebee';
    alertEl.style.color='#c62828';
    alertEl.textContent = `🔴 警告：剩余仅${rem}次请求，减少频繁点击地图`;
  }else if(rem <=10){
    alertEl.style.display = 'block';
    alertEl.style.background='#fff8e1';
    alertEl.style.color='#f57f17';
    alertEl.textContent = `🟡 提醒：剩余${rem}次TidesAtlas请求`;
  }
}
function readRateLimitHeaders(resp){
  const rem = resp.headers.get('X-RateLimit-Remaining');
  const lim = resp.headers.get('X-RateLimit-Limit');
  const reset = resp.headers.get('X-RateLimit-Reset');
  if(rem && lim && reset){
    saveTidesRateLimit(Number(rem), Number(lim), Number(reset));
  }
}
function formatMsDiff(ms){
  if(ms<0) return "已过";
  const h = Math.floor(ms / 3600000);
  const m = Math.floor((ms %3600000)/60000);
  return `${h}h${m}min`;
}

// ========== 潮汐SVG渲染 ==========
function renderTideChart(extremes, portInfo){
  const svg = document.getElementById('tide-svg');
  const sourceInfoEl = document.getElementById('tide-source-info');
  const statusEl = document.getElementById('tide-current-status');
  const countdownEl = document.getElementById('tide-next-countdown');
  const listEl = document.getElementById('tide-extremes-list');
  const errEl = document.getElementById('tide-error-tip');
  errEl.style.display='none';
  if(!extremes || extremes.length===0){
    errEl.textContent="该点位无潮汐数据，请更换坐标";
    errEl.style.display='block';
    svg.innerHTML='';
    return;
  }
  sourceInfoEl.textContent = `📍数据源：${portInfo?.name??"未知站点"}`;
  const items = extremes.map(it=>({
    ts: new Date(it.datetime).getTime(),
    h: Number(it.height_m),
    type: it.type
  })).sort((a,b)=>a.ts-b.ts);
  const nowTs = Date.now();
  let nextEvent = null;
  for(let i=0;i<items.length;i++){
    if(items[i].ts >= nowTs){
      nextEvent = items[i];
      break;
    }
  }
  const hList = items.map(i=>i.h);
  const hMin = Math.min(...hList);
  const hMax = Math.max(...hList);
  const hRange = hMax - hMin || 0.5;
  const W = 600;
  const H = 200;
  const padT =10, padB=30, padL=30, padR=10;
  const chartW = W - padL - padR;
  const chartH = H - padT - padB;
  const tStart = items[0].ts;
  const tEnd = items[items.length-1].ts;
  const tSpan = tEnd - tStart;
  function t2x(ts){ return padL + ((ts - tStart)/tSpan)*chartW; }
  function h2y(hVal){ return padT + chartH - ((hVal - hMin)/hRange)*chartH; }
  let pathD = "";
  const sampleCount = 120;
  for(let s=0;s<=sampleCount;s++){
    const ratio = s/sampleCount;
    const tSample = tStart + ratio * tSpan;
    let hSample;
    if(items.length===1){
      hSample = items[0].h;
    }else{
      let left = items[0];
      let right = items[items.length-1];
      for(let i=0;i<items.length-1;i++){
        if(tSample >= items[i].ts && tSample <= items[i+1].ts){
          left = items[i];
          right = items[i+1];
          break;
        }
      }
      const segSpan = right.ts - left.ts;
      const segRatio = segSpan===0 ? 0 : (tSample-left.ts)/segSpan;
      hSample = left.h + (right.h-left.h)*segRatio;
    }
    const x = t2x(tSample);
    const y = h2y(hSample);
    pathD += (s===0 ? "M":"L") + `${x.toFixed(2)},${y.toFixed(2)} `;
  }
  const lastX = t2x(tEnd);
  const baseY = h2y(hMin);
  const fillPath = pathD + ` L${lastX},${baseY} L${padL},${baseY} Z`;
  const nowX = t2x(nowTs);
  let listHtml = "";
  items.forEach(it=>{
    const d = new Date(it.ts);
    const timeStr = d.getHours().toString().padStart(2,'0')+":"+d.getMinutes().padStart(2,'0');
    const label = it.type==='high'?"满潮":"低潮";
    listHtml += `▸ ${timeStr} ${label} ${it.h.toFixed(2)}m<br/>`;
  });
  listEl.innerHTML = listHtml;
  let statusText = "";
  if(nextEvent){
    const diff = nextEvent.ts - nowTs;
    statusText = `📌当前潮汐状态：${nextEvent.type==='high'?"落潮":"涨潮"}中`;
    countdownEl.textContent = `⏱距离下一${nextEvent.type==='high'?"满潮":"低潮"}：${formatMsDiff(diff)}`;
  }else{
    statusText = "📌当前：已超出今日潮汐窗口";
    countdownEl.textContent = "";
  }
  statusEl.textContent = statusText;
  svg.innerHTML = `
  <defs>
    <linearGradient id="seaGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4285f4" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#4285f4" stop-opacity="0.08"/>
    </linearGradient>
  </defs>
  <path d="${fillPath}" fill="url(#seaGrad)"></path>
  <path d="${pathD}" fill="none" stroke="#1565c0" stroke-width="2"></path>
  ${items.map(it=>{
    const cx = t2x(it.ts);
    const cy = h2y(it.h);
    const fillCol = it.type==='high'?"#1565c0":"#f9a825";
    return `<circle cx="${cx.toFixed(2)}" cy="${cy.toFixed(2)}" r="4" fill="${fillCol}"/>`;
  }).join("")}
  <line x1="${nowX.toFixed(2)}" y1="${padT}" x2="${nowX.toFixed(2)}" y2="${padT+chartH}" stroke="#2e7d32" stroke-width="1.5" stroke-dasharray="4 4"/>
  `;
  // 拿到潮汐阶段供鱼情分析
  window._currentTidePhase = nextEvent ? (nextEvent.type==='high'?"falling":"rising") : null;
}

async function fetchTides(lat, lon){
  try{
    const resp = await fetch(`${TIDES_API_PREFIX}/tides?lat=${lat}&lon=${lon}&days=1`);
    readRateLimitHeaders(resp);
    if(!resp.ok) throw new Error(`HTTP ${resp.status}`);
    const data = await resp.json();
    renderTideChart(data.extremes, data.port);
    runFishAnalysis();
  }catch(err){
    console.error("潮汐请求异常",err);
    const errEl = document.getElementById('tide-error-tip');
    errEl.style.display='block';
    errEl.textContent = "潮汐获取失败："+err.message;
    document.getElementById('tide-svg').innerHTML = '';
  }
}

// ========== 补全fetchWeather Open‑Meteo ==========
async function fetchWeather(lat, lon) {
    try {
        const url = `https://api.open‑meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,pressure_msl,wind_speed_10m,wind_direction_10m,wave_height,wave_period&timezone=auto`;
        const res = await fetch(url);
        if (!res.ok) throw new Error("天气接口异常");
        const data = await res.json();
        console.log("气象数据", data);
        window._weatherCurrent = data.current;
        return data.current;
    } catch (err) {
        console.error("fetchWeather异常", err);
        window._weatherCurrent = null;
        return null;
    }
}

// ========== 鱼情分析 ==========
function runFishAnalysis(){
  const isManual = document.getElementById('chk-manual').checked;
  const sceneText = document.getElementById('inp-scene').value.toLowerCase();
  let tidePhase = window._currentTidePhase;
  let weather = window._weatherCurrent;

  // 手动模式覆盖
  if(isManual){
    tidePhase = document.getElementById('sel-tidephase').value;
  }

  let score = 0;
  let pros = [];
  let cons = [];

  //潮汐权重 0‑35
  if(tidePhase === "rising"){ score +=35; pros.push("✅涨潮：鱼类向岸边觅食活跃"); }
  else if(tidePhase === "falling"){ score +=30; pros.push("✅落潮：水流带出食物"); }
  else if(tidePhase === "highslack"){ score +=18; cons.push("⚠️高平潮水流平缓，咬口偏弱"); }
  else if(tidePhase === "lowslack"){ score +=12; cons.push("⚠️低平潮，鱼活性差"); }

  //环境文本关键词
  if(sceneText.includes("码头")||sceneText.includes("木桩")){ score +=12; pros.push("✅码头结构藏鱼"); }
  if(sceneText.includes("礁石")){ score +=10; pros.push("✅礁石区有庇护，鱼类聚集"); }
  if(sceneText.includes("沙滩")){ cons.push("⚠️沙滩缺少遮蔽"); }

  //海况
  if(weather && !isManual){
    const wv = weather.wave_height ?? 0;
    const wind = weather.wind_speed_10m ??0;
    if(wv>1.2){ cons.push("⚠️浪偏大，抛投难度上升"); }
    else if(wv>0 && wv<=0.6){ score +=8; pros.push("✅轻微浪扰动，激发鱼进食"); }
    if(wind>25){ cons.push("⚠️大风，作钓体验变差"); }
  }

  score = Math.min(score,100);
  document.getElementById('fish-score').textContent = `鱼情综合评分：${score}/100`;
  document.getElementById('fish-pros').innerHTML = pros.join("<br/>");
  document.getElementById('fish-cons').innerHTML = cons.join("<br/>");
  let suggest = `<div>🎣推荐：`;
  if(tidePhase==="rising"||tidePhase==="falling") suggest += "优先路亚/滑铅沉底；";
  else suggest += "建议等待潮汐转换；";
  suggest += `</div>`;
  document.getElementById('fish-suggest').innerHTML = suggest;
}

// ========== UI事件绑定 ==========
document.getElementById('chk-manual').addEventListener('change',function(){
  document.getElementById('manual-group').style.display = this.checked ? 'block':'none';
});

document.getElementById('btn-refresh').addEventListener('click',async function(){
  const lat = Number(document.getElementById('inp-lat').value);
  const lon = Number(document.getElementById('inp-lon').value);
  if(isNaN(lat)||isNaN(lon)){ alert("请输入经纬度"); return; }
  if(!document.getElementById('chk-manual').checked){
    await fetchWeather(lat,lon);
    await fetchTides(lat,lon);
  }
  runFishAnalysis();
});

document.getElementById('btn-save').addEventListener('click',function(){
  const payload = {
    lat:document.getElementById('inp-lat').value,
    lon:document.getElementById('inp-lon').value,
    scene:document.getElementById('inp-scene').value,
    manual:document.getElementById('chk-manual').checked
  };
  localStorage.setItem("savedSpot",JSON.stringify(payload));
  alert("钓点已保存");
});

//模拟地图点击对外暴露接口，真实地图替换这里
window.onMapClick = async function(lat,lon){
  document.getElementById('inp-lat').value = lat;
  document.getElementById('inp-lon').value = lon;
  if(!document.getElementById('chk-manual').checked){
    await fetchWeather(lat, lon);
    await fetchTides(lat, lon);
  }
  runFishAnalysis();
};

window.onload = function(){
  renderRateLimitUi();
  //示例悉尼点位
  document.getElementById('inp-lat').value = -33.87;
  document.getElementById('inp-lon').value = 151.21;
  // 加载保存钓点
  const saved = localStorage.getItem("savedSpot");
  if(saved){
    const obj = JSON.parse(saved);
    document.getElementById('inp-lat').value = obj.lat;
    document.getElementById('inp-lon').value = obj.lon;
    document.getElementById('inp-scene').value = obj.scene;
    document.getElementById('chk-manual').checked = obj.manual;
    document.getElementById('manual-group').style.display = obj.manual ? 'block':'none';
  }
};
</script>

</body>
</html>
